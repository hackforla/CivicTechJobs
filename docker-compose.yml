name: civic-tech-jobs

services:
  pgdb:
    image: postgres:18
    container_name: pgdb
    # user should be the same as your POSTGRES_USER .env variable
    user: postgres
    env_file:
      - dev/dev.env
    volumes:
      - postgres_data:/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: backend
      dockerfile: ../dev/django.dockerfile
    container_name: django
    command: >
      sh -c "python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000 &&
      python manage.py generateschema --file openapi-schema.yml"
    ports:
      - "8000:8000"
    env_file:
      - dev/dev.env
    depends_on:
      pgdb:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /usr/src/app

  next:
    build:
      context: frontend
      dockerfile: ../dev/next.dockerfile
    container_name: next
    env_file:
      - dev/dev.env
    ports:
      - "3000:3000"
    depends_on:
      - django
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/src/app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data: {}
