name: civic-tech-jobs-stage

services:
  pgdb:
    image: postgres:16
    container_name: pgdb-stage
    user: postgres
    env_file:
      - stage/stage.env
    volumes:
      - postgres_data:/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: backend
      dockerfile: ../stage/django.dockerfile
    container_name: django-stage
    ports:
      - "8000:8000"
    env_file:
      - stage/stage.env
    depends_on:
      pgdb:
        condition: service_healthy

  next:
    build:
      context: frontend
      dockerfile: ../stage/next.dockerfile
    container_name: next-stage
    ports:
      - "3000:3000"
    env_file:
      - stage/stage.env
    environment:
      # Routes /api/* and /admin/* through Next's rewrites to the
      # django service so the local stage matches the deployed-stage
      # ALB shape (single origin from the browser's view).
      - BACKEND_INTERNAL_URL=http://django:8000
    depends_on:
      - django

volumes:
  postgres_data:
