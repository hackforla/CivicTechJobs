[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.4"
psycopg = {extras = ["binary"], version = "^3.3.4"}
djangorestframework = "^3.17.1"
python-decouple = "^3.8"
daphne = "^4.2.1"
whitenoise = "^6.12.0"
inflection = "^0.5.1"
uritemplate = "^4.1.1"
pyyaml = "^6.0.2"


[tool.poetry.group.dev.dependencies]
ruff = "^0.15.12"
mypy = "^1.20.2"
django-stubs = "^6.0.3"
djangorestframework-stubs = "^3.16.9"
bandit = {extras = ["toml"], version = "^1.9.4"}
pre-commit = "^4.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["migrations", "frontend"]

[tool.ruff.lint]
# E/W (pycodestyle), F (pyflakes), I (isort), B (bugbear),
# UP (pyupgrade), DJ (django-specific), SIM (simplify), C4 (comprehensions).
# Covers the rule families that the legacy black + flake8 + isort + flake8-bugbear +
# flake8-simplify + flake8-comprehensions pipeline used to enforce, in one tool.
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4"]
# E203 (whitespace before ":") was the legacy .flake8 ignore for black
# compatibility; ruff's formatter is black-compatible by default, so the
# ignore stays. The old config also ignored W503 (line break before binary
# operator), which is a flake8-only rule with no ruff equivalent — ruff
# already formats the way black did, so no carry-over needed.
ignore = ["E203"]

[tool.ruff.lint.isort]
known-third-party = ["django"]

[tool.ruff.format]
# Trailing commas + double quotes match black's defaults, so the format pass
# produces the same shape the old toolchain did.
quote-style = "double"

[tool.mypy]
# Gradual mode. The codebase has no annotations yet; ratchet stricter as
# coverage grows. See CONTRIBUTING.md for the typing policy.
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
exclude = ["migrations/", "frontend/"]

[tool.django-stubs]
django_settings_module = "backend.settings"

[tool.bandit]
# Skip migrations (auto-generated, lots of false positives) and the test
# suite (assertions are not security issues in tests).
exclude_dirs = ["migrations", "ctj_api/tests"]
