[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.4"
psycopg = {extras = ["binary"], version = "^3.3.4"}
djangorestframework = "^3.17.1"
python-decouple = "^3.8"
daphne = "^4.2.1"
whitenoise = "^6.12.0"
inflection = "^0.5.1"
uritemplate = "^4.1.1"
pyyaml = "^6.0.2"


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.git
    | \.venv
    | frontend
    | migrations
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["django"]
skip = [".gitignore", ".dockerignore","__pycache__", "migrations", "frontend"]